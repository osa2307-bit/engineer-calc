<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инженерный Оптимизатор: Напор vs Уровень</title>
    <!-- Подключаем библиотеку -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 1100px;
        }
        h1 { color: #1a73e8; text-align: center; margin-bottom: 25px; }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }
        
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.8rem; font-weight: 600; color: #5f6368; margin-bottom: 5px; }
        input {
            padding: 10px;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 1rem;
        }
        input:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }

        .btn-container { grid-column: 1 / -1; text-align: center; }
        button {
            padding: 12px 45px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #1557b0; }

        .status-panel {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            display: none;
        }
        .status-safe { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-optimize { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .status-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
            padding: 15px;
            background: #e8f0fe;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #1967d2;
        }

        .chart-wrapper { position: relative; height: 450px; width: 100%; }
        .alert-error-msg { color: red; text-align: center; font-weight: bold; margin-bottom: 10px; display: none; }
        .hint { font-size: 0.85rem; color: #5f6368; margin-top: 15px; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h1>Инженерный Оптимизатор</h1>

    <div id="errorMsg" class="alert-error-msg">Ошибка загрузки библиотеки графиков...</div>
    <div id="statusBox" class="status-panel"></div>

    <div class="controls">
        <div class="input-group">
            <label>h1 (м при t=0)</label>
            <input type="number" id="h1" value="400" step="0.1">
        </div>
        <div class="input-group">
            <label>h2 (м при t_замера)</label>
            <input type="number" id="h2" value="500" step="0.1">
        </div>
        <div class="input-group">
            <label>t замера (мин)</label>
            <input type="number" id="t_user" value="30" step="1">
        </div>

        <div class="input-group">
            <label>F<sub style="font-size: 0.7rem;">нач</sub> (Гц)</label>
            <input type="number" id="f_start" value="40" step="1">
        </div>
        <div class="input-group">
            <label>a (Гц/час)</label>
            <input type="number" id="a_val" value="0.1" step="0.001">
        </div>
        <div class="input-group">
            <label>N (коэфф.)</label>
            <input type="number" id="n_val" value="1000" step="10">
        </div>

        <div class="btn-container">
            <button onclick="runCalculation()">Рассчитать</button>
        </div>
    </div>

    <div class="results-grid">
        <div><strong>Уровень (1440 мин):</strong> <span id="resH">-</span> м</div>
        <div><strong>Напор (1440 мин):</strong> <span id="resP">-</span> м</div>
    </div>

    <div class="chart-wrapper">
        <canvas id="mainChart"></canvas>
    </div>
    <div class="hint">Диапазон отображения: 0–3000 м.</div>
</div>

<script>
    let chartInstance = null;

    // Проверка: загружен ли Chart.js
    function isChartLoaded() {
        return typeof Chart !== 'undefined';
    }

    function isUnsafe(h1, slope, fStart, test_a, n) {
        for (let t = 0; t <= 1440; t += 10) {
            const H_t = h1 + (slope * t);
            const F_t = fStart + (test_a * (t / 60));
            const P_t = (Math.pow(F_t, 2) * n) / 2500;
            if (P_t < H_t) return true; 
        }
        return false;
    }

    function runCalculation() {
        if (!isChartLoaded()) {
            document.getElementById('errorMsg').style.display = 'block';
            return;
        } else {
            document.getElementById('errorMsg').style.display = 'none';
        }

        const h1 = parseFloat(document.getElementById('h1').value);
        const h2 = parseFloat(document.getElementById('h2').value);
        const tUser = parseFloat(document.getElementById('t_user').value);
        const fStart = parseFloat(document.getElementById('f_start').value);
        const a = parseFloat(document.getElementById('a_val').value);
        const n = parseFloat(document.getElementById('n_val').value);

        const statusBox = document.getElementById('statusBox');
        statusBox.style.display = 'none';

        if (isNaN(h1) || isNaN(h2) || isNaN(tUser) || isNaN(fStart) || isNaN(a) || isNaN(n) || tUser <= 0) {
            alert("Ошибка: Проверьте введенные данные.");
            return;
        }

        const slope = (h2 - h1) / tUser;
        const p0 = (Math.pow(fStart, 2) * n) / 2500;

        // Анализ безопасности
        if (p0 < h1) {
            statusBox.innerHTML = "❌ КРИТИЧЕСКАЯ ОШИБКА: Напор в начале ниже Уровня.<br>Нужно увеличить F_нач или N.";
            statusBox.className = 'status-panel status-error';
            statusBox.style.display = 'block';
        } else if (isUnsafe(h1, slope, fStart, a, n)) {
            let low = 0, high = 1000;
            for (let i = 0; i < 25; i++) {
                let mid = (low + high) / 2;
                if (isUnsafe(h1, slope, fStart, mid, n)) low = mid;
                else high = mid;
            }
            statusBox.innerHTML = `⚠️ ТРЕБУЕТСЯ ОПТИМИЗАЦИЯ: Графики пересекаются.<br>Минимально допустимый параметр: <b>a ≥ ${high.toFixed(4)}</b>`;
            statusBox.className = 'status-panel status-optimize';
            statusBox.style.display = 'block';
        } else {
            statusBox.innerHTML = "✅ СИСТЕМА В БЕЗОПАСНОСТИ: Напор выше Уровня.";
            statusBox.className = 'status-panel status-safe';
            statusBox.style.display = 'block';
        }

        // Сбор данных
        const timeLabels = [];
        const levelData = [];
        const pressureData = [];

        for (let t = 0; t <= 1440; t += 10) {
            timeLabels.push(t);
            levelData.push(h1 + (slope * t));
            const F_t = fStart + (a * (t / 60));
            pressureData.push((Math.pow(F_t, 2) * n) / 2500);
        }

        // Результаты в панель
        document.getElementById('resH').innerText = (h1 + (slope * 1440)).toFixed(2);
        const fEnd = fStart + (a * (1440 / 60));
        document.getElementById('resP').innerText = (Math.pow(fEnd, 2) * n / 2500).toFixed(2);

        renderChart(timeLabels, levelData, pressureData);
    }

    function renderChart(labels, dataH, dataP) {
        const ctx = document.getElementById('mainChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Уровень (м)',
                        data: dataH,
                        borderColor: '#1a73e8',
                        borderWidth: 3,
                        pointRadius: 0,
                        tension: 0
                    },
                    {
                        label: 'Напор (м)',
                        data: dataP,
                        borderColor: '#d93025',
                        borderWidth: 3,
                        pointRadius: 0,
                        tension: 0.3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: { title: { display: true, text: 'Время (мин)' } },
                    y: { min: 0, max: 3000, title: { display: true, text: 'Высота (м)' }, ticks: { stepSize: 500 } }
                },
                plugins: {
                    tooltip: { mode: 'index', intersect: false },
                    legend: { position: 'top' }
                }
            }
        });
    }

    // Запуск при полной готовности документа
    document.addEventListener('DOMContentLoaded', () => {
        // Небольшая задержка, чтобы дать Chart.js время инициализироваться
        setTimeout(() => {
            runCalculation();
        }, 500);
    });
</script>

</body>
</html>
